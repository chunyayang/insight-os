name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup MUST run before setup-node, or `cache: pnpm` can't find pnpm.
      # It reads the pnpm version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      # --frozen-lockfile fails loudly if pnpm-lock.yaml drifts from package.json.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Deployment is owned by Vercel (preview per PR, prod on merge) — never scripted here.
