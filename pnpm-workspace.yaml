allowBuilds:
  esbuild: true
  unrs-resolver: true
  vue-demi: true

overrides:
  tar@<7.5.21: '>=7.5.21'
  brace-expansion@<5.0.8: '>=5.0.8'
  '@tiptap/core@<3.30.5': '>=3.30.5'
  esbuild@<0.28.1: '>=0.28.1'
  # Nuxt and @nuxtjs/i18n are built against devalue 5.x; stay inside it rather than taking 6.
  devalue@<5.9.3: '^5.9.3'
  serialize-javascript@<7.1.2: '>=7.1.2'
  # @nuxt/ui's @vueuse/integrations lists axios as an optional peer, for its useAxios —
  # which this app doesn't use ($api is $fetch). Keep that peer unresolved so axios and
  # its dependency tree stay out of installs.
  '@vueuse/integrations>axios': '-'
